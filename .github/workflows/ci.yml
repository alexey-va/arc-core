name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.codex/**'
      - 'src/test/e2e/**'
      - 'src/test/e2e-*/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.codex/**'
      - 'src/test/e2e/**'
      - 'src/test/e2e-*/**'
  workflow_dispatch:
    inputs:
      heavy_tests:
        description: Run expensive integration and Paper tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arc-core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and property tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew --build-cache testAll

  integration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.heavy_tests }}
    name: Redis and MySQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify Docker daemon
        run: docker info
      - run: ./gradlew integrationTestAll
